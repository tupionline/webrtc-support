<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent – Support Console</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }

    #container { position: relative; width: 100vw; height: 100vh; }

    #remote-video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    #draw-canvas, #cursor-canvas, #interaction-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    #freeze-canvas     { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; display: none; background: #000; }
    #draw-canvas       { z-index: 2; pointer-events: none; }
    #cursor-canvas     { z-index: 3; pointer-events: none; }
    #interaction-layer { z-index: 4; }

    #interaction-layer.tool-pointer     { cursor: none; }
    #interaction-layer.tool-marker,
    #interaction-layer.tool-highlighter,
    #interaction-layer.tool-arrow       { cursor: crosshair; }

    /* ── Toolbar ── */
    #toolbar {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 12px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .tb-sep { width: 26px; height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }

    .tb-btn {
      width: 42px; height: 42px; border-radius: 11px; border: none;
      background: transparent; color: rgba(255,255,255,0.45); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.14s, color 0.14s;
    }
    .tb-btn:hover  { background: rgba(255,255,255,0.1);  color: #fff; }
    .tb-btn.active { background: rgba(255,255,255,0.16); color: #fff; }
    .tb-btn svg    { width: 19px; height: 19px; }
    .tb-btn.danger:hover  { background: rgba(239,68,68,0.18);  color: #ef4444; }
    .tb-btn.capture:hover { background: rgba(59,130,246,0.2);  color: #60a5fa; }
    .tb-btn.muted   { background: rgba(239,68,68,0.18); color: #ef4444; }
    .tb-btn.freeze:hover  { background: rgba(139,92,246,0.2);  color: #a78bfa; }
    .tb-btn.freeze.active { background: rgba(139,92,246,0.22); color: #a78bfa; }

    #frozen-badge {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(139,92,246,0.18); color: #a78bfa;
      border: 1px solid rgba(139,92,246,0.35);
      padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; display: flex; align-items: center; gap: 7px;
      backdrop-filter: blur(6px); z-index: 11; pointer-events: none;
    }
    #frozen-badge.hidden { display: none; }
    #frozen-badge .fpulse { width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; animation: blink 1.4s infinite; }

    .color-swatch {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.15); cursor: pointer;
      transition: transform 0.13s, border-color 0.13s;
    }
    .color-swatch:hover  { transform: scale(1.18); }
    .color-swatch.active { border-color: #fff; transform: scale(1.12); }

    /* ── Status ── */
    #status {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff;
      padding: 6px 18px; border-radius: 20px; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(6px); z-index: 10; white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex-shrink: 0; }
    .dot.waiting   { background: #f59e0b; animation: blink 1.4s infinite; }
    .dot.connected { background: #22c55e; }
    .dot.error     { background: #ef4444; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    #hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.3); font-size: 12px;
      z-index: 10; pointer-events: none; white-space: nowrap;
    }

    /* ── Waiting overlay ── */
    #waiting-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0f0f0f; z-index: 20; gap: 14px;
    }
    #waiting-overlay.hidden { display: none; }
    #waiting-overlay h2 { font-size: 18px; font-weight: 500; color: #e5e5e5; }
    #waiting-overlay p  { font-size: 13px; color: #666; }
    .spinner { width: 36px; height: 36px; border: 3px solid #2a2a2a; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Camera flash ── */
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 30; pointer-events: none; transition: opacity 0.08s; }
    #flash.pop { opacity: 0.75; }

    /* ── Map panel ── */
    #map-panel {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      width: 260px; border-radius: 16px; overflow: hidden;
      background: rgba(18,18,18,0.88); backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.09);
      z-index: 10; transition: opacity 0.2s;
    }
    #map-panel.hidden { display: none; }
    #leaflet-map { width: 260px; height: 200px; }
    #map-footer {
      padding: 7px 10px; font-size: 11px; color: rgba(255,255,255,0.45);
      display: flex; align-items: center; gap: 6px;
    }
    #map-footer svg { flex-shrink: 0; opacity: 0.5; }
    /* Keep Leaflet zoom control inside rounded corners */
    .leaflet-control-zoom { border: none !important; }
    .leaflet-control-zoom a { background: rgba(30,30,30,0.9) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.12) !important; }
  </style>
</head>
<body>
<div id="container">
  <video id="remote-video" autoplay playsinline></video>
  <canvas id="freeze-canvas"></canvas>
  <canvas id="draw-canvas"></canvas>
  <canvas id="cursor-canvas"></canvas>
  <div id="interaction-layer" class="tool-pointer"></div>

  <div id="toolbar">
    <button class="tb-btn active" id="t-pointer" title="Pointer">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.5 3.21V20.8l4.19-4.19 2.3 5.32 1.84-.8-2.3-5.32H17z"/></svg>
    </button>
    <button class="tb-btn" id="t-marker" title="Marker">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    </button>
    <button class="tb-btn" id="t-highlighter" title="Highlighter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 5 19 8.5l-9 9-5 1 1-5Z"/><line x1="2" y1="22" x2="22" y2="22" stroke-width="3"/></svg>
    </button>
    <button class="tb-btn" id="t-arrow" title="Arrow (drag to draw)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
    </button>

    <div class="tb-sep"></div>

    <div class="color-swatch active" data-color="#ef4444" style="background:#ef4444" title="Red"></div>
    <div class="color-swatch"        data-color="#3b82f6" style="background:#3b82f6" title="Blue"></div>
    <div class="color-swatch"        data-color="#fbbf24" style="background:#fbbf24" title="Yellow"></div>
    <div class="color-swatch"        data-color="#ffffff" style="background:#ffffff" title="White"></div>

    <div class="tb-sep"></div>

    <button class="tb-btn" id="btn-mic" title="Mute microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <div class="tb-sep"></div>

    <button class="tb-btn freeze" id="btn-freeze" title="Freeze frame">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>

    <button class="tb-btn danger"  id="btn-clear"   title="Clear all drawings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>
    </button>
    <button class="tb-btn capture" id="btn-capture" title="Capture & download photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>

  <div id="frozen-badge" class="hidden"><div class="fpulse"></div>FROZEN</div>
  <div id="status">
    <div class="dot waiting" id="status-dot"></div>
    <span id="status-text">Waiting for customer…</span>
  </div>
  <div id="hint">Pointer · Marker · Highlighter · Arrow · Clear · 📷 · Drawings track camera movement</div>

  <div id="waiting-overlay">
    <div class="spinner"></div>
    <h2>Waiting for customer</h2>
    <p>The customer will connect shortly…</p>
  </div>
  <div id="flash"></div>

  <div id="map-panel" class="hidden">
    <div id="leaflet-map"></div>
    <div id="map-footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <span id="map-coords">Acquiring location…</span>
    </div>
  </div>
</div>

<script>
  const video    = document.getElementById('remote-video');
  const freezeCvs = document.getElementById('freeze-canvas');
  const fctx     = freezeCvs.getContext('2d');
  const drawCvs  = document.getElementById('draw-canvas');
  const cursCvs  = document.getElementById('cursor-canvas');
  const dctx     = drawCvs.getContext('2d');
  const cctx     = cursCvs.getContext('2d');
  let frozen = false;
  const layer   = document.getElementById('interaction-layer');
  const dot     = document.getElementById('status-dot');
  const label   = document.getElementById('status-text');
  const overlay = document.getElementById('waiting-overlay');
  const flash   = document.getElementById('flash');

  // ── Block-matching tracker ──────────────────────────────────────────────────
  // Tracks a reference patch in the video frame to anchor drawings to scene content.
  function createTracker(videoEl) {
    const SCALE  = 6;  // downsample factor (1280→213, 720→120)
    const PATCH  = 11; // half-patch in downsampled pixels (23×23 full patch)
    const SEARCH = 15; // half-search radius

    let active = false;
    let anchor = null;   // { x, y } in downsampled pixels
    let refGray = null;  // Uint8Array luminance of reference frame
    let W = 0, H = 0;
    const offset = { x: 0, y: 0 }; // accumulated offset in normalised video coords

    const oc  = document.createElement('canvas');
    const oct = oc.getContext('2d', { willReadFrequently: true });

    function getGray() {
      const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
      if (!vw || !vh) return null;
      W = Math.ceil(vw / SCALE); H = Math.ceil(vh / SCALE);
      oc.width = W; oc.height = H;
      oct.drawImage(videoEl, 0, 0, W, H);
      const d = oct.getImageData(0, 0, W, H).data;
      const g = new Uint8Array(W * H);
      for (let i = 0, j = 0; i < d.length; i += 4, j++)
        g[j] = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8; // fast luminance
      return g;
    }

    return {
      offset,
      get active() { return active; },

      // Call once when first drawing is made. normX/Y = video-normalised anchor point.
      capture(normX, normY) {
        const g = getGray();
        if (!g) return;
        anchor = { x: Math.round(normX * W), y: Math.round(normY * H) };
        refGray = g;
        offset.x = 0; offset.y = 0;
        active = true;
      },

      // Call each frame (throttled externally). Finds where anchor moved and updates offset.
      update() {
        if (!active || !refGray || !anchor) return;
        const curr = getGray();
        if (!curr) return;

        const ax = anchor.x, ay = anchor.y;
        let bx = 0, by = 0, bSAD = Infinity;

        for (let dy = -SEARCH; dy <= SEARCH; dy++) {
          for (let dx = -SEARCH; dx <= SEARCH; dx++) {
            let sad = 0;
            for (let py = -PATCH; py <= PATCH; py += 2) {
              for (let px = -PATCH; px <= PATCH; px += 2) {
                const ry = ay + py, rx = ax + px;
                const cy = ay + dy + py, cx = ax + dx + px;
                if (ry < 0 || ry >= H || rx < 0 || rx >= W) { sad += 50; continue; }
                if (cy < 0 || cy >= H || cx < 0 || cx >= W) { sad += 50; continue; }
                sad += Math.abs(refGray[ry * W + rx] - curr[cy * W + cx]);
              }
            }
            if (sad < bSAD) { bSAD = sad; bx = dx; by = dy; }
          }
        }

        // Accept match only if confident (avg < 25 grey levels per sampled pixel)
        const samples = ((PATCH + 1) * (PATCH + 1)); // approx subsampled count
        if (bSAD < samples * 25) {
          anchor.x = Math.max(PATCH, Math.min(W - PATCH - 1, anchor.x + bx));
          anchor.y = Math.max(PATCH, Math.min(H - PATCH - 1, anchor.y + by));
          offset.x += bx / W;
          offset.y += by / H;
          refGray = curr; // adaptive: update reference to current frame
        }
      },

      reset() { active = false; anchor = null; refGray = null; offset.x = 0; offset.y = 0; }
    };
  }

  const tracker = createTracker(video);

  // ── Tool / color state ────────────────────────────────────────────────────
  let tool       = 'pointer';
  let color      = '#ef4444';
  let cursorPos  = null;
  let isDrawing  = false;
  let prevNorm   = null;  // content-coord prev point for freehand
  let arrowStart = null;  // content-coord arrow start
  let lastPtrSend = 0;
  let lastTrackT  = 0;

  const BRUSH = {
    marker:      { size: 4,  alpha: 1.0,  cap: 'round',  join: 'round'  },
    highlighter: { size: 26, alpha: 0.38, cap: 'square', join: 'round'  },
    arrow:       { size: 3,  alpha: 1.0                                  },
  };

  // All drawing commands, stored in content-space (normalised, offset-free)
  const drawCommands = [];

  // ── Canvas resize ─────────────────────────────────────────────────────────
  function resize() {
    [freezeCvs, drawCvs, cursCvs].forEach(c => { c.width = c.clientWidth; c.height = c.clientHeight; });
    if (frozen) captureFreeze(); // re-snap if window resized while frozen
  }
  window.addEventListener('resize', resize);
  resize();

  function setStatus(s, t) { dot.className = 'dot ' + s; label.textContent = t; }

  // ── Video layout (object-fit: contain) ───────────────────────────────────
  function videoBounds() {
    const vw = video.videoWidth  || drawCvs.width;
    const vh = video.videoHeight || drawCvs.height;
    const ew = drawCvs.width, eh = drawCvs.height;
    const vr = vw / vh, er = ew / eh;
    let w, h, x, y;
    if (vr > er) { w = ew; h = ew / vr; x = 0;          y = (eh - h) / 2; }
    else         { h = eh; w = eh * vr;  y = 0;          x = (ew - w) / 2; }
    return { x, y, w, h };
  }

  // Screen pixel → content-space (subtract current tracking offset)
  function toContent(px, py) {
    const b = videoBounds();
    return {
      x: (px - b.x) / b.w - tracker.offset.x,
      y: (py - b.y) / b.h - tracker.offset.y
    };
  }

  // Content-space → screen pixel (add current tracking offset)
  function fromNormT(nx, ny) {
    const b = videoBounds();
    return { x: b.x + (nx + tracker.offset.x) * b.w, y: b.y + (ny + tracker.offset.y) * b.h };
  }

  // Screen pixel → normalised (no offset, for pointer only)
  function toNorm(px, py)  { const b = videoBounds(); return { x: (px-b.x)/b.w, y: (py-b.y)/b.h }; }
  function inVideo(px, py) { const b = videoBounds(); return px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h; }

  // ── Drawing primitives (pixel coords) ────────────────────────────────────
  function renderLine(ctx, x1, y1, x2, y2, brush, clr) {
    const b = BRUSH[brush];
    ctx.save();
    ctx.globalAlpha = b.alpha; ctx.strokeStyle = clr;
    ctx.lineWidth = b.size; ctx.lineCap = b.cap; ctx.lineJoin = b.join;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  function renderArrow(ctx, x1, y1, x2, y2, clr, alpha) {
    const len = Math.hypot(x2-x1, y2-y1);
    if (len < 3) return;
    const headLen = Math.min(28, len * 0.38);
    const angle   = Math.atan2(y2-y1, x2-x1);
    ctx.save();
    ctx.globalAlpha = alpha ?? 1; ctx.strokeStyle = clr; ctx.fillStyle = clr;
    ctx.lineWidth = BRUSH.arrow.size; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2 - headLen * 0.65 * Math.cos(angle), y2 - headLen * 0.65 * Math.sin(angle));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/7), y2 - headLen * Math.sin(angle - Math.PI/7));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/7), y2 - headLen * Math.sin(angle + Math.PI/7));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Render a single stored command using current tracking offset
  function renderCmd(ctx, cmd) {
    if (cmd.type === 'draw-line') {
      const p1 = fromNormT(cmd.x1, cmd.y1), p2 = fromNormT(cmd.x2, cmd.y2);
      renderLine(ctx, p1.x, p1.y, p2.x, p2.y, cmd.brush, cmd.color);
    } else if (cmd.type === 'draw-arrow') {
      const s = fromNormT(cmd.x1, cmd.y1), e = fromNormT(cmd.x2, cmd.y2);
      renderArrow(ctx, s.x, s.y, e.x, e.y, cmd.color, 1);
    }
  }

  // Centroid of all commands in current video-normalised coords (content + offset)
  function commandsCentroid() {
    let sx = 0, sy = 0, n = 0;
    for (const cmd of drawCommands) {
      sx += cmd.x1 + tracker.offset.x; sy += cmd.y1 + tracker.offset.y; n++;
      sx += cmd.x2 + tracker.offset.x; sy += cmd.y2 + tracker.offset.y; n++;
    }
    return n > 0 ? { x: sx / n, y: sy / n } : { x: 0.5, y: 0.5 };
  }

  // ── Unified animation loop ────────────────────────────────────────────────
  (function animLoop() {
    const now = Date.now();

    // Throttle tracker to ~12 fps (skip when frozen — frame is static)
    if (!frozen && tracker.active && now - lastTrackT > 80) {
      tracker.update();
      lastTrackT = now;
    }

    // Redraw all drawing commands with current tracked offset
    dctx.clearRect(0, 0, drawCvs.width, drawCvs.height);
    for (const cmd of drawCommands) renderCmd(dctx, cmd);

    // Cursor canvas: pointer + arrow preview
    cctx.clearRect(0, 0, cursCvs.width, cursCvs.height);

    if (tool === 'pointer' && cursorPos && inVideo(cursorPos.x, cursorPos.y)) {
      const { x, y } = cursorPos;
      cctx.shadowColor = 'rgba(239,68,68,0.55)'; cctx.shadowBlur = 12;
      cctx.beginPath(); cctx.arc(x, y, 18, 0, Math.PI*2);
      cctx.strokeStyle = 'rgba(239,68,68,0.4)'; cctx.lineWidth = 1.5; cctx.stroke();
      cctx.shadowBlur = 0;
      cctx.beginPath(); cctx.arc(x, y, 8, 0, Math.PI*2);
      cctx.strokeStyle = '#ef4444'; cctx.lineWidth = 2; cctx.stroke();
      cctx.beginPath(); cctx.arc(x, y, 2.5, 0, Math.PI*2);
      cctx.fillStyle = '#ef4444'; cctx.fill();
      cctx.strokeStyle = '#ef4444'; cctx.lineWidth = 1.5;
      cctx.beginPath();
      cctx.moveTo(x-22,y); cctx.lineTo(x-10,y); cctx.moveTo(x+10,y); cctx.lineTo(x+22,y);
      cctx.moveTo(x,y-22); cctx.lineTo(x,y-10); cctx.moveTo(x,y+10); cctx.lineTo(x,y+22);
      cctx.stroke();
    }

    if (tool === 'arrow' && arrowStart && cursorPos) {
      const s = fromNormT(arrowStart.x, arrowStart.y);
      renderArrow(cctx, s.x, s.y, cursorPos.x, cursorPos.y, color, 0.55);
    }

    requestAnimationFrame(animLoop);
  })();

  // ── Data channel helper ──────────────────────────────────────────────────
  let pc = null, dataChannel = null;
  let micStream = null;
  let agentMicMuted = false;
  let leafletMap = null, leafletMarker = null;

  function handleGPS({ lat, lng, accuracy }) {
    const panel = document.getElementById('map-panel');
    panel.classList.remove('hidden');
    document.getElementById('map-coords').textContent =
      `${lat.toFixed(5)}, ${lng.toFixed(5)}  ±${accuracy}m`;
    if (!leafletMap) {
      leafletMap = L.map('leaflet-map', { attributionControl: false, zoomControl: true })
        .setView([lat, lng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafletMap);
      leafletMarker = L.marker([lat, lng]).addTo(leafletMap);
    } else {
      leafletMarker.setLatLng([lat, lng]);
      leafletMap.panTo([lat, lng]);
    }
  }

  function unfreeze() {
    if (!frozen) return;
    frozen = false;
    freezeCvs.style.display = 'none';
    document.getElementById('btn-freeze').classList.remove('active');
    document.getElementById('btn-freeze').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
    document.getElementById('frozen-badge').classList.add('hidden');
  }

  function resetMap() {
    document.getElementById('map-panel').classList.add('hidden');
    if (leafletMap) { leafletMap.remove(); leafletMap = null; leafletMarker = null; }
  }
  function send(msg) {
    if (dataChannel?.readyState === 'open') dataChannel.send(JSON.stringify(msg));
  }

  // ── Pointer tool ─────────────────────────────────────────────────────────
  function sendPointer(px, py) {
    if (!inVideo(px, py)) { send({ type: 'pointer-off' }); return; }
    const now = Date.now();
    if (now - lastPtrSend < 33) return;
    lastPtrSend = now;
    const n = toNorm(px, py); // pointer uses screen coords, no tracking offset
    send({ type: 'pointer', x: n.x, y: n.y });
  }

  // ── Drawing tools ─────────────────────────────────────────────────────────
  function onStart(px, py) {
    if (!inVideo(px, py)) return;
    isDrawing = true;
    const n = toContent(px, py);
    if (tool === 'arrow') arrowStart = n;
    else prevNorm = n;
  }

  function onMove(px, py) {
    if (!isDrawing || !inVideo(px, py)) return;
    const n = toContent(px, py);
    if (tool === 'marker' || tool === 'highlighter') {
      if (!prevNorm) { prevNorm = n; return; }
      const cmd = { type: 'draw-line', x1: prevNorm.x, y1: prevNorm.y, x2: n.x, y2: n.y, brush: tool, color };
      drawCommands.push(cmd);
      send(cmd);
      prevNorm = n;
    }
  }

  function onEnd(px, py) {
    if (!isDrawing) return;
    isDrawing = false;
    const needsAnchor = !tracker.active;

    if (tool === 'arrow' && arrowStart) {
      const n = inVideo(px, py) ? toContent(px, py) : arrowStart;
      const cmd = { type: 'draw-arrow', x1: arrowStart.x, y1: arrowStart.y, x2: n.x, y2: n.y, color };
      drawCommands.push(cmd);
      send(cmd);
      arrowStart = null;
    }
    prevNorm = null;

    // Anchor tracker on the first stroke of a fresh canvas
    if (needsAnchor && drawCommands.length > 0) {
      const c = commandsCentroid();
      tracker.capture(c.x, c.y);
      send({ type: 'track-anchor', x: c.x, y: c.y });
    }
  }

  // ── Interaction events ───────────────────────────────────────────────────
  function epos(e) {
    const r = cursCvs.getBoundingClientRect();
    const s = e.touches ? e.touches[0] : e;
    return { x: s.clientX - r.left, y: s.clientY - r.top };
  }

  layer.addEventListener('mousedown',  e => { const p = epos(e); cursorPos = p; if (tool !== 'pointer') onStart(p.x, p.y); });
  layer.addEventListener('mousemove',  e => { const p = epos(e); cursorPos = p; tool === 'pointer' ? sendPointer(p.x, p.y) : onMove(p.x, p.y); });
  layer.addEventListener('mouseup',    e => { onEnd(epos(e).x, epos(e).y); });
  layer.addEventListener('mouseleave', () => { cursorPos = null; send({ type: 'pointer-off' }); if (isDrawing) onEnd(-1, -1); });

  layer.addEventListener('touchstart', e => { e.preventDefault(); const p = epos(e); cursorPos = p; if (tool !== 'pointer') onStart(p.x, p.y); }, { passive: false });
  layer.addEventListener('touchmove',  e => { e.preventDefault(); const p = epos(e); cursorPos = p; tool === 'pointer' ? sendPointer(p.x, p.y) : onMove(p.x, p.y); }, { passive: false });
  layer.addEventListener('touchend',   () => { const p = cursorPos || {x:-1,y:-1}; cursorPos = null; onEnd(p.x, p.y); send({ type: 'pointer-off' }); });

  // ── Toolbar ───────────────────────────────────────────────────────────────
  document.querySelectorAll('[id^="t-"]').forEach(btn => {
    btn.addEventListener('click', () => {
      tool = btn.id.replace('t-', '');
      document.querySelectorAll('[id^="t-"]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      layer.className = 'tool-' + tool;
      send({ type: 'pointer-off' });
      isDrawing = false; arrowStart = null; prevNorm = null;
    });
  });

  document.querySelectorAll('.color-swatch').forEach(el => {
    el.addEventListener('click', () => {
      color = el.dataset.color;
      document.querySelectorAll('.color-swatch').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
    });
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    drawCommands.length = 0;
    tracker.reset();
    send({ type: 'draw-clear' });
  });

  function captureFreeze() {
    const b = videoBounds();
    fctx.fillStyle = '#000';
    fctx.fillRect(0, 0, freezeCvs.width, freezeCvs.height);
    fctx.drawImage(video, b.x, b.y, b.w, b.h);
  }

  document.getElementById('btn-freeze').addEventListener('click', () => {
    if (!video.srcObject) return; // nothing to freeze
    frozen = !frozen;
    const btn = document.getElementById('btn-freeze');
    const badge = document.getElementById('frozen-badge');
    if (frozen) {
      captureFreeze();
      freezeCvs.style.display = 'block';
      tracker.reset(); // static frame — no tracking needed
      btn.classList.add('active');
      badge.classList.remove('hidden');
      // swap button icon to "play" so it's clear clicking again resumes
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
    } else {
      freezeCvs.style.display = 'none';
      btn.classList.remove('active');
      badge.classList.add('hidden');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
    }
  });

  document.getElementById('btn-mic').addEventListener('click', () => {
    agentMicMuted = !agentMicMuted;
    if (micStream) micStream.getAudioTracks().forEach(t => { t.enabled = !agentMicMuted; });
    document.getElementById('btn-mic').classList.toggle('muted', agentMicMuted);
  });

  document.getElementById('btn-capture').addEventListener('click', () => {
    flash.classList.add('pop');
    setTimeout(() => flash.classList.remove('pop'), 220);
    const cap = document.createElement('canvas');
    cap.width = drawCvs.width; cap.height = drawCvs.height;
    const cx = cap.getContext('2d');
    cx.fillStyle = '#000'; cx.fillRect(0, 0, cap.width, cap.height);
    const b = videoBounds();
    cx.drawImage(video, b.x, b.y, b.w, b.h);
    cx.drawImage(drawCvs, 0, 0);
    const link = document.createElement('a');
    link.download = `support-${Date.now()}.png`;
    link.href = cap.toDataURL('image/png');
    link.click();
  });

  // ── Mic init ─────────────────────────────────────────────────────────────
  async function initMic() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true }
      });
    } catch (e) {
      console.warn('Mic unavailable:', e.message);
    }
  }

  // ── WebRTC ────────────────────────────────────────────────────────────────
  function showVideo(src) {
    video.srcObject = src;
    video.play().catch(() => {});
    overlay.classList.add('hidden');
    setStatus('connected', 'Customer connected');
  }

  function buildPC(iceConfig) {
    pc = new RTCPeerConnection(iceConfig);
    pc.addTransceiver('video', { direction: 'recvonly' });

    if (micStream) {
      micStream.getAudioTracks().forEach(t => pc.addTrack(t, micStream));
    } else {
      pc.addTransceiver('audio', { direction: 'recvonly' });
    }

    dataChannel = pc.createDataChannel('control', { ordered: true });
    dataChannel.onopen  = () => {};
    dataChannel.onclose = () => {};
    dataChannel.onmessage = ({ data }) => {
      try { const m = JSON.parse(data); if (m.type === 'gps') handleGPS(m); } catch {}
    };

    pc.ontrack = ({ track }) => {
      if (track.kind === 'video') {
        showVideo(new MediaStream([track])); // video-only stream; audio handled separately
      } else if (track.kind === 'audio') {
        let aud = document.getElementById('remote-audio');
        if (!aud) { aud = document.createElement('audio'); aud.id = 'remote-audio'; document.body.appendChild(aud); }
        aud.srcObject = new MediaStream([track]);
        aud.play().catch(() => {});
      }
    };

    pc.onicecandidate = ({ candidate }) => {
      if (candidate) ws.send(JSON.stringify({ type: 'ice', candidate }));
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        if (!video.srcObject) {
          const r = pc.getReceivers().find(r => r.track?.kind === 'video');
          if (r) showVideo(new MediaStream([r.track]));
        }
        overlay.classList.add('hidden');
        setStatus('connected', 'Customer connected');
      } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
        setStatus('waiting', 'Waiting for customer…');
        overlay.classList.remove('hidden');
        video.srcObject = null;
        drawCommands.length = 0;
        tracker.reset();
        unfreeze();
        resetMap();
      }
    };
  }

  async function initiateCall() {
    if (pc) { pc.close(); pc = null; }
    const [iceConfig] = await Promise.all([iceConfigPromise, micInitPromise]);
    buildPC(iceConfig);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', offer }));
  }

  // ── ICE config (STUN + TURN from server) ────────────────────────────────
  const iceConfigPromise = fetch('/ice-config')
    .then(r => r.json())
    .catch(() => ({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }));

  // ── Signalling ────────────────────────────────────────────────────────────
  const micInitPromise = initMic(); // kick off early; awaited before call starts
  const ws = new WebSocket(`wss://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', role: 'agent' }));
  ws.onmessage = async ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'peer-joined' && msg.role === 'customer') {
      setStatus('waiting', 'Customer ready, connecting…');
      await initiateCall();
    }
    if (msg.type === 'answer' && pc)
      await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
    if (msg.type === 'ice' && pc)
      try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch {}
    if (msg.type === 'peer-left') {
      setStatus('waiting', 'Waiting for customer…');
      overlay.classList.remove('hidden');
      video.srcObject = null;
      drawCommands.length = 0;
      tracker.reset();
      unfreeze();
      resetMap();
      pc?.close(); pc = null;
    }
  };
  ws.onerror = () => setStatus('error', 'Connection error');
  ws.onclose = () => setStatus('error', 'Disconnected — please refresh');
</script>
</body>
</html>
