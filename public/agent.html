<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent – Support Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }

    #container { position: relative; width: 100vw; height: 100vh; }

    #remote-video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    #draw-canvas, #cursor-canvas, #interaction-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    #draw-canvas      { z-index: 2; pointer-events: none; }
    #cursor-canvas    { z-index: 3; pointer-events: none; }
    #interaction-layer { z-index: 4; }

    #interaction-layer.tool-pointer     { cursor: none; }
    #interaction-layer.tool-marker,
    #interaction-layer.tool-highlighter,
    #interaction-layer.tool-arrow       { cursor: crosshair; }

    /* ── Toolbar ── */
    #toolbar {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .tb-sep {
      width: 26px; height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 5px 0;
    }

    .tb-btn {
      width: 42px; height: 42px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.14s, color 0.14s;
    }
    .tb-btn:hover  { background: rgba(255,255,255,0.1);  color: #fff; }
    .tb-btn.active { background: rgba(255,255,255,0.16); color: #fff; }
    .tb-btn svg    { width: 19px; height: 19px; }

    .tb-btn.danger:hover { background: rgba(239,68,68,0.18); color: #ef4444; }
    .tb-btn.capture:hover { background: rgba(59,130,246,0.2); color: #60a5fa; }

    .color-swatch {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: transform 0.13s, border-color 0.13s;
    }
    .color-swatch:hover  { transform: scale(1.18); }
    .color-swatch.active { border-color: #fff; transform: scale(1.12); }

    /* ── Status ── */
    #status {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff;
      padding: 6px 18px; border-radius: 20px; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(6px); z-index: 10; white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex-shrink: 0; }
    .dot.waiting   { background: #f59e0b; animation: blink 1.4s infinite; }
    .dot.connected { background: #22c55e; }
    .dot.error     { background: #ef4444; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    #hint {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3); font-size: 12px;
      z-index: 10; pointer-events: none; white-space: nowrap;
    }

    /* ── Waiting overlay ── */
    #waiting-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0f0f0f; z-index: 20;
      gap: 14px; transition: opacity 0.3s;
    }
    #waiting-overlay.hidden { display: none; }
    #waiting-overlay h2 { font-size: 18px; font-weight: 500; color: #e5e5e5; }
    #waiting-overlay p  { font-size: 13px; color: #666; }
    .spinner { width: 36px; height: 36px; border: 3px solid #2a2a2a; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Camera flash ── */
    #flash {
      position: absolute; inset: 0;
      background: #fff; opacity: 0;
      z-index: 30; pointer-events: none;
      transition: opacity 0.08s;
    }
    #flash.pop { opacity: 0.75; }
  </style>
</head>
<body>
<div id="container">
  <video id="remote-video" autoplay playsinline></video>
  <canvas id="draw-canvas"></canvas>
  <canvas id="cursor-canvas"></canvas>
  <div id="interaction-layer" class="tool-pointer"></div>

  <!-- ── Toolbar ── -->
  <div id="toolbar">

    <!-- Tools -->
    <button class="tb-btn active" id="t-pointer" title="Pointer">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M5.5 3.21V20.8l4.19-4.19 2.3 5.32 1.84-.8-2.3-5.32H17z"/>
      </svg>
    </button>

    <button class="tb-btn" id="t-marker" title="Marker">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      </svg>
    </button>

    <button class="tb-btn" id="t-highlighter" title="Highlighter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15.5 5 19 8.5l-9 9-5 1 1-5Z"/>
        <line x1="2" y1="22" x2="22" y2="22" stroke-width="3"/>
      </svg>
    </button>

    <button class="tb-btn" id="t-arrow" title="Arrow (drag to draw)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="13 6 19 12 13 18"/>
      </svg>
    </button>

    <div class="tb-sep"></div>

    <!-- Colors -->
    <div class="color-swatch active" data-color="#ef4444" style="background:#ef4444" title="Red"></div>
    <div class="color-swatch"        data-color="#3b82f6" style="background:#3b82f6" title="Blue"></div>
    <div class="color-swatch"        data-color="#fbbf24" style="background:#fbbf24" title="Yellow"></div>
    <div class="color-swatch"        data-color="#ffffff" style="background:#ffffff" title="White"></div>

    <div class="tb-sep"></div>

    <!-- Actions -->
    <button class="tb-btn danger"  id="btn-clear"   title="Clear all drawings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
      </svg>
    </button>

    <button class="tb-btn capture" id="btn-capture" title="Capture & download photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>

  </div>

  <div id="status">
    <div class="dot waiting" id="status-dot"></div>
    <span id="status-text">Waiting for customer…</span>
  </div>

  <div id="hint">Pointer · Marker · Highlighter · Arrow · Clear · 📷</div>

  <div id="waiting-overlay">
    <div class="spinner"></div>
    <h2>Waiting for customer</h2>
    <p>The customer will connect shortly…</p>
  </div>

  <div id="flash"></div>
</div>

<script>
  const video   = document.getElementById('remote-video');
  const drawCvs = document.getElementById('draw-canvas');
  const cursCvs = document.getElementById('cursor-canvas');
  const dctx    = drawCvs.getContext('2d');
  const cctx    = cursCvs.getContext('2d');
  const layer   = document.getElementById('interaction-layer');
  const dot     = document.getElementById('status-dot');
  const label   = document.getElementById('status-text');
  const overlay = document.getElementById('waiting-overlay');
  const flash   = document.getElementById('flash');

  // ── State ────────────────────────────────────────────────────────────────
  let pc = null, dataChannel = null;
  let tool       = 'pointer';
  let color      = '#ef4444';
  let cursorPos  = null;
  let isDrawing  = false;
  let prevNorm   = null;   // { x, y } for freehand continuity
  let arrowStart = null;   // { x, y } normalised
  let lastPtrSend = 0;

  const BRUSH = {
    marker:      { size: 4,  alpha: 1.0,  cap: 'round',  join: 'round'  },
    highlighter: { size: 26, alpha: 0.38, cap: 'square', join: 'round'  },
    arrow:       { size: 3,  alpha: 1.0                                  },
  };

  // ── Canvas resize ────────────────────────────────────────────────────────
  function resize() {
    [drawCvs, cursCvs].forEach(c => { c.width = c.clientWidth; c.height = c.clientHeight; });
  }
  window.addEventListener('resize', resize);
  resize();

  function setStatus(s, t) { dot.className = 'dot ' + s; label.textContent = t; }

  // ── Video layout ─────────────────────────────────────────────────────────
  function videoBounds() {
    const vw = video.videoWidth  || drawCvs.width;
    const vh = video.videoHeight || drawCvs.height;
    const ew = drawCvs.width, eh = drawCvs.height;
    const vr = vw / vh, er = ew / eh;
    let w, h, x, y;
    if (vr > er) { w = ew; h = ew / vr; x = 0;          y = (eh - h) / 2; }
    else         { h = eh; w = eh * vr;  y = 0;          x = (ew - w) / 2; }
    return { x, y, w, h };
  }

  function toNorm(px, py)   { const b = videoBounds(); return { x: (px-b.x)/b.w, y: (py-b.y)/b.h }; }
  function fromNorm(nx, ny) { const b = videoBounds(); return { x: b.x + nx*b.w, y: b.y + ny*b.h }; }
  function inVideo(px, py)  { const b = videoBounds(); return px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h; }

  // ── Drawing primitives ───────────────────────────────────────────────────
  function renderLine(ctx, x1, y1, x2, y2, brush, clr) {
    const b = BRUSH[brush];
    ctx.save();
    ctx.globalAlpha     = b.alpha;
    ctx.strokeStyle     = clr;
    ctx.lineWidth       = b.size;
    ctx.lineCap         = b.cap;
    ctx.lineJoin        = b.join;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function renderArrow(ctx, x1, y1, x2, y2, clr, alpha) {
    const len = Math.hypot(x2-x1, y2-y1);
    if (len < 3) return;
    const headLen = Math.min(28, len * 0.38);
    const angle   = Math.atan2(y2-y1, x2-x1);
    ctx.save();
    ctx.globalAlpha = alpha ?? 1;
    ctx.strokeStyle = clr;
    ctx.fillStyle   = clr;
    ctx.lineWidth   = BRUSH.arrow.size;
    ctx.lineCap     = 'round';
    // shaft
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2 - headLen * 0.65 * Math.cos(angle), y2 - headLen * 0.65 * Math.sin(angle));
    ctx.stroke();
    // head
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/7), y2 - headLen * Math.sin(angle - Math.PI/7));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/7), y2 - headLen * Math.sin(angle + Math.PI/7));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ── Cursor / arrow-preview animation loop ────────────────────────────────
  (function cursorLoop() {
    cctx.clearRect(0, 0, cursCvs.width, cursCvs.height);

    if (tool === 'pointer' && cursorPos && inVideo(cursorPos.x, cursorPos.y)) {
      const { x, y } = cursorPos;
      cctx.shadowColor = 'rgba(239,68,68,0.55)';
      cctx.shadowBlur  = 12;
      cctx.beginPath(); cctx.arc(x, y, 18, 0, Math.PI*2);
      cctx.strokeStyle = 'rgba(239,68,68,0.4)'; cctx.lineWidth = 1.5; cctx.stroke();
      cctx.shadowBlur  = 0;
      cctx.beginPath(); cctx.arc(x, y, 8, 0, Math.PI*2);
      cctx.strokeStyle = '#ef4444'; cctx.lineWidth = 2; cctx.stroke();
      cctx.beginPath(); cctx.arc(x, y, 2.5, 0, Math.PI*2);
      cctx.fillStyle = '#ef4444'; cctx.fill();
      cctx.strokeStyle = '#ef4444'; cctx.lineWidth = 1.5;
      cctx.beginPath();
      cctx.moveTo(x-22,y); cctx.lineTo(x-10,y);
      cctx.moveTo(x+10,y); cctx.lineTo(x+22,y);
      cctx.moveTo(x,y-22); cctx.lineTo(x,y-10);
      cctx.moveTo(x,y+10); cctx.lineTo(x,y+22);
      cctx.stroke();
    }

    // Arrow drag preview
    if (tool === 'arrow' && arrowStart && cursorPos) {
      const s = fromNorm(arrowStart.x, arrowStart.y);
      renderArrow(cctx, s.x, s.y, cursorPos.x, cursorPos.y, color, 0.55);
    }

    requestAnimationFrame(cursorLoop);
  })();

  // ── Data channel helper ──────────────────────────────────────────────────
  function send(msg) {
    if (dataChannel?.readyState === 'open') dataChannel.send(JSON.stringify(msg));
  }

  // ── Pointer tool ─────────────────────────────────────────────────────────
  function sendPointer(px, py) {
    if (!inVideo(px, py)) { send({ type: 'pointer-off' }); return; }
    const now = Date.now();
    if (now - lastPtrSend < 33) return;
    lastPtrSend = now;
    const n = toNorm(px, py);
    send({ type: 'pointer', x: n.x, y: n.y });
  }

  // ── Drawing events ───────────────────────────────────────────────────────
  function onStart(px, py) {
    if (!inVideo(px, py)) return;
    isDrawing = true;
    const n = toNorm(px, py);
    if (tool === 'arrow') { arrowStart = n; }
    else                  { prevNorm   = n; }
  }

  function onMove(px, py) {
    if (!isDrawing) return;
    if (tool === 'marker' || tool === 'highlighter') {
      if (!inVideo(px, py)) return;
      const n = toNorm(px, py);
      if (!prevNorm) { prevNorm = n; return; }
      const p = fromNorm(prevNorm.x, prevNorm.y);
      const c = fromNorm(n.x, n.y);
      renderLine(dctx, p.x, p.y, c.x, c.y, tool, color);
      send({ type: 'draw-line', x1: prevNorm.x, y1: prevNorm.y, x2: n.x, y2: n.y, brush: tool, color });
      prevNorm = n;
    }
  }

  function onEnd(px, py) {
    if (!isDrawing) return;
    isDrawing = false;
    if (tool === 'arrow' && arrowStart) {
      const n = inVideo(px, py) ? toNorm(px, py) : arrowStart;
      const s = fromNorm(arrowStart.x, arrowStart.y);
      const e = fromNorm(n.x, n.y);
      renderArrow(dctx, s.x, s.y, e.x, e.y, color);
      send({ type: 'draw-arrow', x1: arrowStart.x, y1: arrowStart.y, x2: n.x, y2: n.y, color });
      arrowStart = null;
    }
    prevNorm = null;
  }

  // ── Interaction layer events ─────────────────────────────────────────────
  function epos(e) {
    const r   = cursCvs.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }

  layer.addEventListener('mousedown', e => {
    const p = epos(e); cursorPos = p;
    if (tool !== 'pointer') onStart(p.x, p.y);
  });
  layer.addEventListener('mousemove', e => {
    const p = epos(e); cursorPos = p;
    if (tool === 'pointer') sendPointer(p.x, p.y);
    else onMove(p.x, p.y);
  });
  layer.addEventListener('mouseup',   e => { const p = epos(e); onEnd(p.x, p.y); });
  layer.addEventListener('mouseleave', () => {
    cursorPos = null;
    send({ type: 'pointer-off' });
    if (isDrawing) onEnd(-1, -1);
  });

  layer.addEventListener('touchstart', e => {
    e.preventDefault(); const p = epos(e); cursorPos = p;
    if (tool !== 'pointer') onStart(p.x, p.y);
  }, { passive: false });
  layer.addEventListener('touchmove', e => {
    e.preventDefault(); const p = epos(e); cursorPos = p;
    if (tool === 'pointer') sendPointer(p.x, p.y);
    else onMove(p.x, p.y);
  }, { passive: false });
  layer.addEventListener('touchend', () => {
    const p = cursorPos || { x: -1, y: -1 };
    cursorPos = null;
    onEnd(p.x, p.y);
    send({ type: 'pointer-off' });
  });

  // ── Toolbar ──────────────────────────────────────────────────────────────
  document.querySelectorAll('[id^="t-"]').forEach(btn => {
    btn.addEventListener('click', () => {
      tool = btn.id.replace('t-', '');
      document.querySelectorAll('[id^="t-"]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      layer.className = 'tool-' + tool;
      send({ type: 'pointer-off' });
      isDrawing = false; arrowStart = null; prevNorm = null;
    });
  });

  document.querySelectorAll('.color-swatch').forEach(el => {
    el.addEventListener('click', () => {
      color = el.dataset.color;
      document.querySelectorAll('.color-swatch').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
    });
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    dctx.clearRect(0, 0, drawCvs.width, drawCvs.height);
    send({ type: 'draw-clear' });
  });

  document.getElementById('btn-capture').addEventListener('click', () => {
    // Flash
    flash.classList.add('pop');
    setTimeout(() => flash.classList.remove('pop'), 220);

    // Composite video frame + drawings
    const cap = document.createElement('canvas');
    cap.width  = drawCvs.width;
    cap.height = drawCvs.height;
    const cx = cap.getContext('2d');
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, cap.width, cap.height);
    const b = videoBounds();
    cx.drawImage(video, b.x, b.y, b.w, b.h);
    cx.drawImage(drawCvs, 0, 0);

    const link = document.createElement('a');
    link.download = `support-${Date.now()}.png`;
    link.href     = cap.toDataURL('image/png');
    link.click();
  });

  // ── WebRTC ───────────────────────────────────────────────────────────────
  function buildPC() {
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.addTransceiver('video', { direction: 'recvonly' });

    dataChannel = pc.createDataChannel('control', { ordered: true });
    dataChannel.onopen  = () => console.log('channel open');
    dataChannel.onclose = () => console.log('channel closed');

    pc.ontrack = ({ track, streams }) => {
      // Some browsers fire ontrack with an empty streams array — fall back to raw track
      video.srcObject = (streams && streams[0]) ? streams[0] : new MediaStream([track]);
      overlay.classList.add('hidden');
      setStatus('connected', 'Customer connected');
    };

    pc.onicecandidate = ({ candidate }) => {
      if (candidate) ws.send(JSON.stringify({ type: 'ice', candidate }));
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        // Fallback: if ontrack didn't fire yet, pull from receiver directly
        if (!video.srcObject) {
          const receiver = pc.getReceivers().find(r => r.track?.kind === 'video');
          if (receiver) video.srcObject = new MediaStream([receiver.track]);
        }
        overlay.classList.add('hidden');
        setStatus('connected', 'Customer connected');
      } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
        setStatus('waiting', 'Waiting for customer…');
        overlay.classList.remove('hidden');
        video.srcObject = null;
        dctx.clearRect(0, 0, drawCvs.width, drawCvs.height);
      }
    };
  }

  async function initiateCall() {
    if (pc) { pc.close(); pc = null; }
    buildPC();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', offer }));
  }

  // ── Signalling ────────────────────────────────────────────────────────────
  const ws = new WebSocket(`wss://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', role: 'agent' }));
  ws.onmessage = async ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'peer-joined' && msg.role === 'customer') {
      setStatus('waiting', 'Customer ready, connecting…');
      await initiateCall();
    }
    if (msg.type === 'answer' && pc)
      await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
    if (msg.type === 'ice' && pc)
      try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch {}
    if (msg.type === 'peer-left') {
      setStatus('waiting', 'Waiting for customer…');
      overlay.classList.remove('hidden');
      video.srcObject = null;
      dctx.clearRect(0, 0, drawCvs.width, drawCvs.height);
      pc?.close(); pc = null;
    }
  };
  ws.onerror = () => setStatus('error', 'Connection error');
  ws.onclose = () => setStatus('error', 'Disconnected — please refresh');
</script>
</body>
</html>
