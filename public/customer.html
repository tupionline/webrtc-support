<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Customer – Support Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    #container { position: relative; width: 100vw; height: 100vh; }

    #local-video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }

    #draw-canvas, #pointer-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #draw-canvas    { z-index: 1; }
    #pointer-canvas { z-index: 2; }

    #status {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff;
      padding: 6px 18px; border-radius: 20px; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(6px); white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex-shrink: 0; }
    .dot.waiting   { background: #f59e0b; animation: blink 1.4s infinite; }
    .dot.connected { background: #22c55e; }
    .dot.error     { background: #ef4444; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    #hint {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.35); font-size: 12px; pointer-events: none;
    }

    #btn-ai-customer {
      position: absolute; bottom: 20px; left: 20px; z-index: 10;
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: rgba(139,92,246,0.22); backdrop-filter: blur(10px);
      color: #a78bfa; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.14s;
    }
    #btn-ai-customer:hover { background: rgba(139,92,246,0.38); }
    #btn-ai-customer svg { width: 22px; height: 22px; }

    #ai-sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      max-height: 78vh; z-index: 30;
      background: rgba(11,11,14,0.97); backdrop-filter: blur(22px);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
    }
    #ai-sheet.open { transform: translateY(0); }
    #ai-sheet-handle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px 10px; flex-shrink: 0;
    }
    #ai-sheet-handle span { font-size: 14px; font-weight: 600; color: #c4b5fd; }
    #ai-sheet-close {
      width: 28px; height: 28px; border-radius: 8px; border: none;
      background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.45);
      font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #ai-sheet-body { overflow-y: auto; padding: 4px 16px 28px; display: flex; flex-direction: column; gap: 10px; }

    #ai-input-state { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 8px; }
    #ai-input-state p { font-size: 13px; color: rgba(255,255,255,0.55); }
    #customer-desc {
      width: 100%; min-height: 90px; padding: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; color: #fff; font-size: 14px; font-family: inherit;
      resize: none; outline: none; line-height: 1.5;
    }
    #customer-desc:focus { border-color: rgba(139,92,246,0.5); }
    #customer-desc::placeholder { color: rgba(255,255,255,0.25); }
    #btn-capture-analyse {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      background: #7c3aed; color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #btn-capture-analyse:hover { background: #6d28d9; }
    #btn-capture-analyse:disabled { opacity: 0.5; cursor: default; }

    .ai-loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 0; color: rgba(255,255,255,0.4); font-size: 13px; }
    .ai-spinner { width: 26px; height: 26px; border: 2.5px solid rgba(196,181,253,0.2); border-top-color: #a78bfa; border-radius: 50%; animation: blink 0s, spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ai-error { color: #f87171; font-size: 13px; padding: 12px; background: rgba(239,68,68,0.08); border-radius: 10px; }
    .ai-problem-box { background: rgba(139,92,246,0.09); border: 1px solid rgba(139,92,246,0.22); border-radius: 12px; padding: 12px 14px; }
    .ai-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 6px; }
    .ai-problem-box .ai-section-label { color: #a78bfa; }
    .ai-problem-text { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.55; }
    .ai-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .ai-card-title { font-size: 13px; font-weight: 600; color: #e2e8f0; }
    .ai-card-desc  { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; }
    .yt-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
      padding: 7px 13px; border-radius: 8px;
      background: rgba(255,0,0,0.12); border: 1px solid rgba(255,0,0,0.25);
      color: #f87171; font-size: 12px; font-weight: 500; text-decoration: none;
    }
    .yt-link:hover { background: rgba(255,0,0,0.22); }

    #btn-mute {
      position: absolute; bottom: 20px; right: 20px; z-index: 10;
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: rgba(18,18,18,0.82); backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.6); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.14s, color 0.14s;
    }
    #btn-mute:hover { background: rgba(40,40,40,0.92); color: #fff; }
    #btn-mute.muted { background: rgba(239,68,68,0.22); color: #ef4444; }
    #btn-mute svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
<div id="container">
  <video id="local-video" autoplay playsinline muted></video>
  <canvas id="draw-canvas"></canvas>
  <canvas id="pointer-canvas"></canvas>

  <div id="status">
    <div class="dot waiting" id="status-dot"></div>
    <span id="status-text">Starting camera…</span>
  </div>
  <div id="hint">Point camera at what you need help with</div>
  <button id="btn-ai-customer" title="Get AI fix suggestions">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.4L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.6z"/><path d="M19 14l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" opacity=".55"/><path d="M5 17l.7 2 2 .7-2 .7L5 23l-.7-2.6L2 19.4l2-.7z" opacity=".35"/></svg>
  </button>

  <div id="ai-sheet">
    <div id="ai-sheet-handle">
      <span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;margin-right:5px"><path d="M12 2l1.8 5.4L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.6z"/></svg>
        AI Assistant
      </span>
      <button id="ai-sheet-close">✕</button>
    </div>
    <div id="ai-sheet-body"></div>
  </div>

  <button id="btn-mute" title="Mute microphone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
</div>

<script>
  const video   = document.getElementById('local-video');
  const drawCvs = document.getElementById('draw-canvas');
  const ptrCvs  = document.getElementById('pointer-canvas');
  const dctx    = drawCvs.getContext('2d');
  const pctx    = ptrCvs.getContext('2d');
  const dot     = document.getElementById('status-dot');
  const label   = document.getElementById('status-text');

  let pc      = null;
  let pointer = null; // { x, y } normalised — NO tracking offset (screen position)
  let customerChannel = null;
  let geoWatchId = null;

  function startGPS() {
    if (!navigator.geolocation) return;
    geoWatchId = navigator.geolocation.watchPosition(
      ({ coords }) => {
        if (customerChannel?.readyState === 'open') {
          customerChannel.send(JSON.stringify({
            type: 'gps',
            lat: coords.latitude,
            lng: coords.longitude,
            accuracy: Math.round(coords.accuracy)
          }));
        }
      },
      () => {},
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
  }

  function stopGPS() {
    if (geoWatchId != null) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; }
    customerChannel = null;
  }

  // ── Block-matching tracker (same engine as agent) ─────────────────────────
  function createTracker(videoEl) {
    const SCALE  = 6;
    const PATCH  = 11;
    const SEARCH = 15;

    let active = false;
    let anchor = null;
    let refGray = null;
    let W = 0, H = 0;
    const offset = { x: 0, y: 0 };

    const oc  = document.createElement('canvas');
    const oct = oc.getContext('2d', { willReadFrequently: true });

    function getGray() {
      const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
      if (!vw || !vh) return null;
      W = Math.ceil(vw / SCALE); H = Math.ceil(vh / SCALE);
      oc.width = W; oc.height = H;
      oct.drawImage(videoEl, 0, 0, W, H);
      const d = oct.getImageData(0, 0, W, H).data;
      const g = new Uint8Array(W * H);
      for (let i = 0, j = 0; i < d.length; i += 4, j++)
        g[j] = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
      return g;
    }

    return {
      offset,
      get active() { return active; },

      capture(normX, normY) {
        const g = getGray();
        if (!g) return;
        anchor = { x: Math.round(normX * W), y: Math.round(normY * H) };
        refGray = g;
        offset.x = 0; offset.y = 0;
        active = true;
      },

      update() {
        if (!active || !refGray || !anchor) return;
        const curr = getGray();
        if (!curr) return;
        const ax = anchor.x, ay = anchor.y;
        let bx = 0, by = 0, bSAD = Infinity;
        for (let dy = -SEARCH; dy <= SEARCH; dy++) {
          for (let dx = -SEARCH; dx <= SEARCH; dx++) {
            let sad = 0;
            for (let py = -PATCH; py <= PATCH; py += 2) {
              for (let px = -PATCH; px <= PATCH; px += 2) {
                const ry = ay+py, rx = ax+px, cy = ay+dy+py, cx = ax+dx+px;
                if (ry<0||ry>=H||rx<0||rx>=W) { sad+=50; continue; }
                if (cy<0||cy>=H||cx<0||cx>=W) { sad+=50; continue; }
                sad += Math.abs(refGray[ry*W+rx] - curr[cy*W+cx]);
              }
            }
            if (sad < bSAD) { bSAD = sad; bx = dx; by = dy; }
          }
        }
        const samples = (PATCH + 1) * (PATCH + 1);
        if (bSAD < samples * 25) {
          anchor.x = Math.max(PATCH, Math.min(W-PATCH-1, anchor.x + bx));
          anchor.y = Math.max(PATCH, Math.min(H-PATCH-1, anchor.y + by));
          offset.x += bx / W;
          offset.y += by / H;
          refGray = curr;
        }
      },

      reset() { active = false; anchor = null; refGray = null; offset.x = 0; offset.y = 0; }
    };
  }

  const tracker = createTracker(video);
  let lastTrackT = 0;

  // All draw commands received from agent, in content-space normalised coords
  const drawCommands = [];

  // ── Canvas sizing ────────────────────────────────────────────────────────
  function resize() {
    [drawCvs, ptrCvs].forEach(c => { c.width = c.clientWidth; c.height = c.clientHeight; });
  }
  window.addEventListener('resize', resize);
  resize();

  function setStatus(s, t) { dot.className = 'dot ' + s; label.textContent = t; }

  // ── Video layout ─────────────────────────────────────────────────────────
  function videoBounds() {
    const vw = video.videoWidth  || drawCvs.width;
    const vh = video.videoHeight || drawCvs.height;
    const ew = drawCvs.width, eh = drawCvs.height;
    const vr = vw / vh, er = ew / eh;
    let w, h, x, y;
    if (vr > er) { w = ew; h = ew / vr; x = 0;          y = (eh - h) / 2; }
    else         { h = eh; w = eh * vr;  y = 0;          x = (ew - w) / 2; }
    return { x, y, w, h };
  }

  // Content-space → screen pixel (tracked drawings)
  function fromNormT(nx, ny) {
    const b = videoBounds();
    return { x: b.x + (nx + tracker.offset.x) * b.w, y: b.y + (ny + tracker.offset.y) * b.h };
  }

  // Normalised → screen pixel (pointer, no tracking)
  function fromNorm(nx, ny) {
    const b = videoBounds();
    return { x: b.x + nx * b.w, y: b.y + ny * b.h };
  }

  // ── Drawing primitives ───────────────────────────────────────────────────
  const BRUSH = {
    marker:      { size: 4,  alpha: 1.0,  cap: 'round',  join: 'round' },
    highlighter: { size: 26, alpha: 0.38, cap: 'square', join: 'round' },
    arrow:       { size: 3,  alpha: 1.0 },
  };

  function renderLine(x1, y1, x2, y2, brush, color) {
    const b = BRUSH[brush] || BRUSH.marker;
    dctx.save();
    dctx.globalAlpha = b.alpha; dctx.strokeStyle = color;
    dctx.lineWidth = b.size; dctx.lineCap = b.cap; dctx.lineJoin = b.join;
    dctx.beginPath(); dctx.moveTo(x1, y1); dctx.lineTo(x2, y2); dctx.stroke();
    dctx.restore();
  }

  function renderArrow(x1, y1, x2, y2, color) {
    const len = Math.hypot(x2-x1, y2-y1);
    if (len < 3) return;
    const headLen = Math.min(28, len * 0.38);
    const angle   = Math.atan2(y2-y1, x2-x1);
    dctx.save();
    dctx.strokeStyle = color; dctx.fillStyle = color;
    dctx.lineWidth = BRUSH.arrow.size; dctx.lineCap = 'round';
    dctx.beginPath();
    dctx.moveTo(x1, y1);
    dctx.lineTo(x2 - headLen * 0.65 * Math.cos(angle), y2 - headLen * 0.65 * Math.sin(angle));
    dctx.stroke();
    dctx.beginPath();
    dctx.moveTo(x2, y2);
    dctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/7), y2 - headLen * Math.sin(angle - Math.PI/7));
    dctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/7), y2 - headLen * Math.sin(angle + Math.PI/7));
    dctx.closePath(); dctx.fill();
    dctx.restore();
  }

  function renderCmd(cmd) {
    if (cmd.type === 'draw-line') {
      const p1 = fromNormT(cmd.x1, cmd.y1), p2 = fromNormT(cmd.x2, cmd.y2);
      renderLine(p1.x, p1.y, p2.x, p2.y, cmd.brush, cmd.color);
    } else if (cmd.type === 'draw-arrow') {
      const s = fromNormT(cmd.x1, cmd.y1), e = fromNormT(cmd.x2, cmd.y2);
      renderArrow(s.x, s.y, e.x, e.y, cmd.color);
    }
  }

  // ── Unified animation loop ────────────────────────────────────────────────
  (function animLoop() {
    const now = Date.now();

    // Update tracker ~12 fps
    if (tracker.active && now - lastTrackT > 80) {
      tracker.update();
      lastTrackT = now;
    }

    // Redraw drawings with current tracking offset
    dctx.clearRect(0, 0, drawCvs.width, drawCvs.height);
    for (const cmd of drawCommands) renderCmd(cmd);

    // Pointer (no tracking offset — always screen position)
    pctx.clearRect(0, 0, ptrCvs.width, ptrCvs.height);
    if (pointer) {
      const { x, y } = fromNorm(pointer.x, pointer.y);
      const t = Date.now() / 500;
      const r = 22 + Math.sin(t) * 6;

      pctx.shadowColor = 'rgba(239,68,68,0.6)'; pctx.shadowBlur = 14;
      pctx.beginPath(); pctx.arc(x, y, r, 0, Math.PI*2);
      pctx.strokeStyle = 'rgba(239,68,68,0.45)'; pctx.lineWidth = 2; pctx.stroke();
      pctx.shadowBlur = 0;
      pctx.beginPath(); pctx.arc(x, y, 10, 0, Math.PI*2);
      pctx.strokeStyle = '#ef4444'; pctx.lineWidth = 2.5; pctx.stroke();
      pctx.beginPath(); pctx.arc(x, y, 3, 0, Math.PI*2);
      pctx.fillStyle = '#ef4444'; pctx.fill();
      pctx.strokeStyle = '#ef4444'; pctx.lineWidth = 1.5;
      pctx.beginPath();
      pctx.moveTo(x-22,y); pctx.lineTo(x-12,y); pctx.moveTo(x+12,y); pctx.lineTo(x+22,y);
      pctx.moveTo(x,y-22); pctx.lineTo(x,y-12); pctx.moveTo(x,y+12); pctx.lineTo(x,y+22);
      pctx.stroke();
    }

    requestAnimationFrame(animLoop);
  })();

  // ── Data channel messages ─────────────────────────────────────────────────
  function handleMsg(msg) {
    switch (msg.type) {
      case 'pointer':       pointer = { x: msg.x, y: msg.y }; break;
      case 'pointer-off':   pointer = null; break;
      case 'draw-line':
      case 'draw-arrow':    drawCommands.push(msg); break;
      case 'draw-clear':    drawCommands.length = 0; tracker.reset(); break;
      case 'track-anchor':  tracker.capture(msg.x, msg.y); break;
    }
  }

  // ── WebRTC (answerer) ─────────────────────────────────────────────────────
  const iceConfigPromise = fetch('/ice-config')
    .then(r => r.json())
    .catch(() => ({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }));

  function buildPC(stream, iceConfig) {
    pc = new RTCPeerConnection(iceConfig);
    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    pc.ontrack = ({ track }) => {
      if (track.kind === 'audio') {
        let aud = document.getElementById('agent-audio');
        if (!aud) { aud = document.createElement('audio'); aud.id = 'agent-audio'; document.body.appendChild(aud); }
        aud.srcObject = new MediaStream([track]);
        aud.play().catch(() => {});
      }
    };

    pc.onicecandidate = ({ candidate }) => {
      if (candidate) ws.send(JSON.stringify({ type: 'ice', candidate }));
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') {
        setStatus('connected', 'Agent connected');
      } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
        setStatus('waiting', 'Waiting for agent…');
        pointer = null;
        drawCommands.length = 0;
        tracker.reset();
      }
    };

    pc.ondatachannel = ({ channel }) => {
      customerChannel = channel;
      channel.onopen  = () => startGPS();
      channel.onclose = () => stopGPS();
      channel.onmessage = ({ data }) => {
        try { handleMsg(JSON.parse(data)); } catch {}
      };
    };
  }

  // ── Camera ────────────────────────────────────────────────────────────────
  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    video.srcObject = stream;
    return stream;
  }

  // ── Signalling ────────────────────────────────────────────────────────────
  const ws = new WebSocket(`wss://${location.host}`);
  let stream;

  ws.onopen = async () => {
    setStatus('waiting', 'Starting camera…');
    try {
      stream = await startCamera();
      setStatus('waiting', 'Waiting for agent…');
      ws.send(JSON.stringify({ type: 'join', role: 'customer' }));
    } catch (e) {
      setStatus('error', 'Camera error: ' + e.message);
    }
  };

  ws.onmessage = async ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'peer-joined' && msg.role === 'agent') setStatus('waiting', 'Agent ready, connecting…');
    if (msg.type === 'offer') {
      if (pc) { pc.close(); pc = null; }
      const iceConfig = await iceConfigPromise;
      buildPC(stream, iceConfig);
      await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'answer', answer }));
    }
    if (msg.type === 'ice' && pc)
      try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch {}
    if (msg.type === 'peer-left') {
      setStatus('waiting', 'Waiting for agent…');
      pointer = null;
      drawCommands.length = 0;
      tracker.reset();
      stopGPS();
      pc?.close(); pc = null;
    }
  };

  ws.onerror = () => setStatus('error', 'Connection error');
  ws.onclose = () => setStatus('error', 'Disconnected — please refresh');

  // ── AI Assistant ──────────────────────────────────────────────────────────
  const aiSheet     = document.getElementById('ai-sheet');
  const aiSheetBody = document.getElementById('ai-sheet-body');

  document.getElementById('ai-sheet-close').addEventListener('click', () => aiSheet.classList.remove('open'));

  // Step 1 — show description input
  document.getElementById('btn-ai-customer').addEventListener('click', () => {
    aiSheet.classList.add('open');
    aiSheetBody.innerHTML = `
      <div id="ai-input-state">
        <p>Briefly describe what's wrong, then capture the scene.</p>
        <textarea id="customer-desc" placeholder="e.g. Water is leaking from under the sink…" rows="3"></textarea>
        <button id="btn-capture-analyse">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Capture &amp; Analyse
        </button>
      </div>`;
    document.getElementById('btn-capture-analyse').addEventListener('click', runAI);
  });

  // Step 2 — capture, notify agent, call AI
  async function runAI() {
    const description = (document.getElementById('customer-desc')?.value || '').trim();

    // Capture frame at full res for AI
    const fullCap = document.createElement('canvas');
    fullCap.width = video.videoWidth || 1280;
    fullCap.height = video.videoHeight || 720;
    fullCap.getContext('2d').drawImage(video, 0, 0);
    const imageData = fullCap.toDataURL('image/jpeg', 0.82).replace(/^data:image\/jpeg;base64,/, '');

    // Capture small thumbnail to send to agent via data channel
    const thumbCap = document.createElement('canvas');
    thumbCap.width = 320; thumbCap.height = 180;
    thumbCap.getContext('2d').drawImage(video, 0, 0, 320, 180);
    const thumbnail = thumbCap.toDataURL('image/jpeg', 0.5);

    // Send activity to agent immediately (before AI finishes)
    if (customerChannel?.readyState === 'open') {
      customerChannel.send(JSON.stringify({ type: 'customer-activity', description, thumbnail }));
    }

    // Switch to loading state
    aiSheetBody.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div><p>Analysing…</p></div>';

    try {
      const r = await fetch('/ai-assist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageData, description })
      });
      const data = await r.json();
      if (data.error) throw new Error(data.error);

      const cards = (data.suggestions || []).map(s => `
        <div class="ai-card">
          <div class="ai-card-title">${s.title}</div>
          <div class="ai-card-desc">${s.description}</div>
          <a class="yt-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.youtube)}" target="_blank">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M23 7s-.3-2-1.2-2.8c-1.1-1.2-2.4-1.2-3-1.3C16.2 2.8 12 2.8 12 2.8s-4.2 0-6.8.2c-.6.1-1.9.1-3 1.3C1.3 5 1 7 1 7S.7 9.1.7 11.3v2c0 2.1.3 4.2.3 4.2s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.3 21.7 12 21.7 12 21.7s4.2 0 6.8-.3c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.3-2.1.3-4.2v-2C23.3 9.1 23 7 23 7zm-13.5 8.5V8.2l8 3.7-8 3.6z"/></svg>
            Watch on YouTube
          </a>
        </div>`).join('');

      aiSheetBody.innerHTML = `
        <div class="ai-problem-box">
          <div class="ai-section-label">Problem identified</div>
          <p class="ai-problem-text">${data.problem}</p>
        </div>
        <div class="ai-section-label">Suggested fixes</div>
        ${cards}`;
    } catch (e) {
      aiSheetBody.innerHTML = `<div class="ai-error">⚠ ${e.message}</div>`;
    }
  }

  // ── Mute button ───────────────────────────────────────────────────────────
  let customerMicMuted = false;
  document.getElementById('btn-mute').addEventListener('click', () => {
    customerMicMuted = !customerMicMuted;
    if (stream) stream.getAudioTracks().forEach(t => { t.enabled = !customerMicMuted; });
    document.getElementById('btn-mute').classList.toggle('muted', customerMicMuted);
  });
</script>
</body>
</html>
